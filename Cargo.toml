[workspace]
members = [
    "crates/goro-core",
    "crates/goro-parser",
    "crates/goro-vfs",
    "crates/goro-sapi",
    "crates/goro-ext-standard",
    "crates/goro-ext-date",
    "crates/goro-ext-json",
    "crates/goro-ext-ctype",
    "crates/goro-ext-hash",
    "crates/goro-ext-openssl",
    "crates/goro-ext-zlib",
    "crates/goro-zlib",
    "crates/goro-ext-gmp",
    "crates/goro-ext-bz2",
    "crates/goro-ext-curl",
    "crates/goro-ext-mysqli",
    "crates/goro-ext-pdo",
    "crates/goro-ext-pgsql",
    "crates/goro-ext-session",
    "crates/goro-ext-sockets",
    "crates/goro-ext-mbstring",
    "crates/goro-phpt",
    "crates/goro-ext-xml",
    "crates/goro-ext-spl",
    "crates/goro-ext-reflection",
    "crates/goro-pcre",
    "crates/goro-ext-zend-test",
    "crates/goro-ext-bcmath",
    "crates/goro-ext-filter",
    "crates/goro-ext-iconv",
    "crates/goro-ext-gettext",
    "crates/goro-ext-sysvipc",
    "crates/goro-ext-ftp",
    "crates/goro-ext-pcntl",
    "crates/goro-ext-posix",
    "crates/goro-ext-calendar",
    "crates/goro-ext-phar",
    "crates/goro-ext-exif",
    "crates/goro-ext-zip",
    "crates/goro-ext-fileinfo",
    "crates/goro-ext-sodium",
    "crates/goro-ext-soap",
]
resolver = "2"

# Style lints that would churn large parts of the codebase; everything else
# in clippy's default set is enforced in CI with -D warnings.
[workspace.lints.clippy]
collapsible_if = "allow"
collapsible_else_if = "allow"
collapsible_match = "allow"
type_complexity = "allow"
too_many_arguments = "allow"

[package]
name = "goro"
version = "0.1.0"
edition = "2024"
description = "A PHP 8.5 implementation in Rust"
license = "MIT"

[lints]
workspace = true

[dependencies]
goro-core = { path = "crates/goro-core" }
libc = "0.2"
goro-parser = { path = "crates/goro-parser" }
goro-vfs = { path = "crates/goro-vfs" }
goro-sapi = { path = "crates/goro-sapi" }
goro-ext-standard = { path = "crates/goro-ext-standard" }
goro-ext-date = { path = "crates/goro-ext-date" }
goro-ext-json = { path = "crates/goro-ext-json" }
goro-ext-ctype = { path = "crates/goro-ext-ctype" }
goro-ext-hash = { path = "crates/goro-ext-hash" }
goro-ext-openssl = { path = "crates/goro-ext-openssl" }
goro-ext-zlib = { path = "crates/goro-ext-zlib" }
goro-ext-gmp = { path = "crates/goro-ext-gmp" }
goro-ext-bz2 = { path = "crates/goro-ext-bz2" }
goro-ext-curl = { path = "crates/goro-ext-curl" }
goro-ext-mysqli = { path = "crates/goro-ext-mysqli" }
goro-ext-pdo = { path = "crates/goro-ext-pdo" }
goro-phpt = { path = "crates/goro-phpt" }
goro-ext-xml = { path = "crates/goro-ext-xml" }
goro-ext-session = { path = "crates/goro-ext-session" }
goro-ext-sockets = { path = "crates/goro-ext-sockets" }
goro-ext-mbstring = { path = "crates/goro-ext-mbstring" }
goro-ext-spl = { path = "crates/goro-ext-spl" }
goro-ext-reflection = { path = "crates/goro-ext-reflection" }
goro-ext-zend-test = { path = "crates/goro-ext-zend-test" }
goro-ext-bcmath = { path = "crates/goro-ext-bcmath" }
goro-ext-filter = { path = "crates/goro-ext-filter" }
goro-ext-soap = { path = "crates/goro-ext-soap" }
goro-ext-iconv = { path = "crates/goro-ext-iconv" }
goro-ext-gettext = { path = "crates/goro-ext-gettext" }
goro-ext-sysvipc = { path = "crates/goro-ext-sysvipc" }
goro-ext-ftp = { path = "crates/goro-ext-ftp" }
goro-ext-pcntl = { path = "crates/goro-ext-pcntl" }
goro-ext-posix = { path = "crates/goro-ext-posix" }
goro-ext-calendar = { path = "crates/goro-ext-calendar" }
goro-ext-phar = { path = "crates/goro-ext-phar" }
goro-ext-exif = { path = "crates/goro-ext-exif" }
goro-ext-zip = { path = "crates/goro-ext-zip" }
goro-ext-fileinfo = { path = "crates/goro-ext-fileinfo" }
goro-ext-sodium = { path = "crates/goro-ext-sodium" }

[features]
default = ["ext-standard"]
ext-standard = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

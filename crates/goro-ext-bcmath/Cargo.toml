[package]
name = "goro-ext-bcmath"
version = "0.1.0"
edition = "2024"
description = "PHP bcmath extension (libbcmath port) for goro-rs"

[lints]
workspace = true

[dependencies]
goro-core = { path = "../goro-core" }
goro-parser = { path = "../goro-parser" }
# Only the integer layer (Nat), as in ext/gmp.
puremp = { version = "0.3.0", default-features = false, features = ["std", "int"] }

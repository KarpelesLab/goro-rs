[package]
name = "goro-imagick"
version = "0.1.0"
edition = "2024"
description = "A pure-Rust image engine with ImageMagick 7 (MagickWand) semantics, on the OxideAV crates, for goro-rs's Imagick extension"

[lints]
workspace = true

[dependencies]
# The OxideAV crates are pre-1.0 and release often; versions are pinned (as
# in goro-gd) so that a new release cannot break the build unannounced.
oxideav-core = "=0.1.41"
oxideav-image-filter = "=0.1.3"
oxideav-raster = "=0.1.3"
# glyph outlines and font metrics (the version goro-gd uses)
skrifa = "=0.40.0"
oxideav-png = { version = "=0.1.12", default-features = false }
oxideav-mjpeg = { version = "=0.1.13", default-features = false }
oxideav-gif = { version = "=0.0.14", default-features = false }
oxideav-webp = { version = "=0.3.1", default-features = false }
oxideav-bmp = { version = "=0.1.8", default-features = false }
oxideav-tiff = { version = "=0.0.9", default-features = false }
oxideav-ico = { version = "=0.0.8", default-features = false }
oxideav-tga = { version = "=0.0.5", default-features = false }
oxideav-qoi = { version = "=0.1.7", default-features = false }
oxideav-pbm = { version = "=0.0.5", default-features = false }

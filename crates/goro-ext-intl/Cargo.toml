[package]
name = "goro-ext-intl"
version = "0.1.0"
edition = "2024"
description = "PHP intl extension for goro-rs, over the pure-Rust intl crate"

[lints]
workspace = true

[dependencies]
goro-core = { path = "../goro-core" }
goro-ext-date = { path = "../goro-ext-date" }
# UConverter: the multi-byte charset tables
goro-ext-iconv = { path = "../goro-ext-iconv" }
goro-ext-mbstring = { path = "../goro-ext-mbstring" }
# The ICU analog everything is built on (KarpelesLab/intlrs).
intl = { version = "=0.6.5", default-features = false, features = [
    "full", "alloc", "names", "normalization", "segmentation", "bidi", "case", "identifiers",
    "confusables", "iana-tz", "number", "number-numsys", "currency", "datetime", "calendars-extra",
    "displaynames", "list", "relative", "spellout", "transliterate", "locale",
    "tz-names",
    "segmentation-dict-cjk",
    "segmentation-dict-km",
    "segmentation-dict-lao",
    "segmentation-dict-my",
] }
# The IANA tzdb (what intl::timezone embeds), for zone transitions.
timezone-data = "0.2"
# ICU4X, for what intl lacks: collation tailorings combined with the
# collator attributes, raw (one-level) decomposition mappings.
icu_normalizer = "2.3"
icu_collator = "2.3"
icu_locale_core = "2.3"

[package]
name = "goro-core"
version = "0.1.0"
edition = "2024"
description = "PHP engine core: values, compiler, and VM for goro-rs"

[lints]
workspace = true

[dependencies]
goro-parser = { path = "../goro-parser" }
indexmap = "2"
# UTS #46 mapping data for ext/uri's lexbor IDNA port (idna's backend)
idna_adapter = { version = "1", features = ["compiled_data"] }
corosensei = "0.2"
libc = "0.2"

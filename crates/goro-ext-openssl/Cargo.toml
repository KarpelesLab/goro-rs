[package]
name = "goro-ext-openssl"
description = "PHP openssl extension on purecrypto: keys, X.509, CSR, PKCS#7/CMS/PKCS#12, ciphers, signatures, TLS streams"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
purecrypto = { version = "0.10", default-features = false, features = [
    "std",
    "hash",
    "cipher",
    "kdf",
    "bignum",
    "rng",
    "rsa",
    "der",
    "dh",
    "dsa",
    "ec",
    "legacy-ec",
    "ec-custom",
    "ed25519-table",
    "ed448-table",
    "p256-table",
    "x509",
    "pkcs12",
    "tls",
    "tls-legacy",
    "linux-getrandom",
] }

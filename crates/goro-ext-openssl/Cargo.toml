[package]
name = "goro-ext-openssl"
version = "0.1.0"
edition = "2024"
description = "PHP openssl extension for goro-rs"

[dependencies]
goro-core = { path = "../goro-core" }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
cipher = { version = "0.4", features = ["alloc"] }
md-5 = "0.10"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
digest = "0.10"
rand = "0.8"
rsa = { version = "0.9", features = ["sha1", "sha2"] }
pkcs1 = { version = "0.7", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem", "encryption"] }
pem-rfc7468 = "0.7"
signature = { version = "2", features = ["digest"] }
x509-cert = { version = "0.2", features = ["builder", "pem"] }
spki = { version = "0.7", features = ["pem"] }
const-oid = { version = "0.9", features = ["db"] }
der = { version = "0.7", features = ["std", "pem"] }

[package]
name = "goro-ext-openssl"
version = "0.1.0"
edition = "2024"
description = "PHP openssl extension for goro-rs"

[lints]
workspace = true

[dependencies]
goro-core = { path = "../goro-core" }
purecrypto = { version = "0.10", default-features = false, features = ["std", "hash", "cipher", "legacy-ciphers", "kdf", "bignum", "rng", "rsa", "der", "dh", "dsa", "x509", "pkcs12", "ec", "legacy-ec", "whirlpool-table", "ed25519-table", "ed448-table", "p256-table", "tls", "tls-legacy"] }
# Legacy-provider block ciphers purecrypto does not provide (Blowfish is
# internal-only there): RustCrypto implementations, with their `cipher` traits.
cipher = "0.4"
blowfish = { version = "0.9", features = ["bcrypt"] }
cast5 = "0.11"
idea = "0.5"
rc2 = "0.8"
# Arithmetic on public values only (parameter generation, verification,
# printing); secret material stays on purecrypto's constant-time bignums.
puremp = { version = "0.3.0", default-features = false, features = ["std", "int"] }
libc = "0.2"

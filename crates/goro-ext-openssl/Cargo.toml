[package]
name = "goro-ext-openssl"
version = "0.1.0"
edition = "2024"
description = "PHP openssl extension for goro-rs"

[lints]
workspace = true

[dependencies]
goro-core = { path = "../goro-core" }
purecrypto = { version = "0.10", default-features = false, features = ["std", "hash", "cipher", "legacy-ciphers", "kdf", "bignum", "rng", "rsa", "der", "dh", "dsa", "x509", "pkcs12", "ec", "legacy-ec", "whirlpool-table", "ed25519-table", "ed448-table", "p256-table"] }
# Legacy-provider block ciphers purecrypto does not provide (Blowfish is
# internal-only there): RustCrypto implementations, with their `cipher` traits.
cipher = "0.4"
blowfish = { version = "0.9", features = ["bcrypt"] }
cast5 = "0.11"
idea = "0.5"
rc2 = "0.8"
# General-purpose big integers (parsing/printing, generic EC/DSA/DH arithmetic)
num-bigint-dig = { version = "0.8", features = ["rand", "prime"] }
num-traits = "0.2"
num-integer = "0.1"
rand = "0.8"

[package]
name = "goro-ext-standard"
version = "0.1.0"
edition = "2024"
description = "PHP standard extension for goro-rs"

[lints]
workspace = true

[dependencies]
goro-core = { path = "../goro-core" }
goro-parser = { path = "../goro-parser" }
goro-vfs = { path = "../goro-vfs" }
goro-pcre = { path = "../goro-pcre" }
libc = "0.2"
md-5 = "0.10"
sha2 = "0.10"
goro-zlib = { path = "../goro-zlib" }
compcol = { version = "=0.7.3", default-features = false, features = ["alloc", "bzip2"] }
tempfile = "3"

[package]
name = "goro-engine"
description = "Compiler and virtual machine executing PHP"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
goro-syntax = { path = "../goro-syntax" }
goro-runtime = { path = "../goro-runtime" }
goro-ext-standard = { path = "../goro-ext-standard" }
goro-regex = { path = "../goro-regex" }
goro-ext-hash = { path = "../goro-ext-hash" }
goro-ext-random = { path = "../goro-ext-random" }
goro-ext-date = { path = "../goro-ext-date" }
goro-ext-bcmath = { path = "../goro-ext-bcmath" }
goro-ext-gmp = { path = "../goro-ext-gmp" }
goro-ext-filter = { path = "../goro-ext-filter" }
goro-ext-sodium = { path = "../goro-ext-sodium" }
goro-ext-uri = { path = "../goro-ext-uri" }
goro-charset = { path = "../goro-charset" }
goro-ext-zlib = { path = "../goro-ext-zlib" }
goro-ext-zip = { path = "../goro-ext-zip" }
goro-ext-phar = { path = "../goro-ext-phar" }
goro-xml = { path = "../goro-xml" }
goro-ext-openssl = { path = "../goro-ext-openssl" }
goro-ext-intl = { path = "../goro-ext-intl" }
goro-ext-gd = { path = "../goro-ext-gd" }
goro-ext-exif = { path = "../goro-ext-exif" }
goro-ext-curl = { path = "../goro-ext-curl" }
libc = "0.2"
corosensei = "0.2"
compcol = { version = "0.7", default-features = false, features = ["alloc", "std", "bzip2"] }

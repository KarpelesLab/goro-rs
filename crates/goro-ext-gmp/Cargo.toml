[package]
name = "goro-ext-gmp"
version = "0.1.0"
edition = "2024"
description = "PHP gmp extension for goro-rs"

[lints]
workspace = true

[dependencies]
goro-core = { path = "../goro-core" }
# Only the integer layer: no rationals/floats/polynomials etc.
puremp = { version = "0.3.0", default-features = false, features = ["std", "int"] }

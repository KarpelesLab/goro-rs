[package]
name = "goro-gd"
version = "0.1.0"
edition = "2024"
description = "Pure Rust port of the libgd bundled with php-src (ext/gd/libgd) for goro-rs"

[lints]
workspace = true

[dependencies]
goro-zlib = { path = "../goro-zlib" }
skrifa = "0.40.0"
oxideav-webp = { version = "0.2.3", default-features = false }
oxideav-vp8 = { version = "0.2.7", default-features = false }
oxideav-avif = "0.0.13"

[package]
name = "goro-ext-curl"
version = "0.1.0"
edition = "2024"
description = "PHP curl extension for goro-rs"

[lints]
workspace = true

[dependencies]
goro-core = { path = "../goro-core" }
ureq = { version = "3", features = ["rustls"] }
goro-zlib = { path = "../goro-zlib" }
libc = "0.2"
purecrypto = { version = "0.10", default-features = false, features = ["std", "hash", "cipher", "rng"] }

[package]
name = "goro-ext-curl"
version = "0.1.0"
edition = "2024"
description = "PHP curl extension for goro-rs"

[lints]
workspace = true

[dependencies]
goro-core = { path = "../goro-core" }
goro-ext-standard = { path = "../goro-ext-standard" }
goro-zlib = { path = "../goro-zlib" }
libc = "0.2"
purecrypto = { version = "0.10", default-features = false, features = ["std", "hash", "cipher", "legacy-ciphers", "kdf", "bignum", "rng", "rsa", "der", "x509", "pkcs12", "ec", "ed25519-table", "ed448-table", "p256-table", "tls"] }

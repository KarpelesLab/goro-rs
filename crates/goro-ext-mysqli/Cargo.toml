[package]
name = "goro-ext-mysqli"
version = "0.1.0"
edition = "2024"
description = "PHP mysqli extension (and mysqlnd) for goro-rs"

[lints]
workspace = true

[dependencies]
goro-core = { path = "../goro-core" }
purecrypto = { version = "0.10", default-features = false, features = ["std", "hash", "bignum", "rng", "rsa", "der", "tls"] }
flate2 = "1"
libc = "0.2"

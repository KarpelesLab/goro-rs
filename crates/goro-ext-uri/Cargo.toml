[package]
name = "goro-ext-uri"
description = "PHP uri extension: RFC 3986 and WHATWG URL parsing (Uri\\Rfc3986\\Uri, Uri\\WhatWg\\Url)"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
goro-runtime = { path = "../goro-runtime" }
# The maintainer's Unicode crate: NFC, Bidi classes, joining types and
# general categories for UTS #46 (the IDNA mapping table itself is generated
# from unicode.org's IdnaMappingTable.txt, see src/whatwg/idna_table.rs).
intl = { version = "0.6.5", default-features = false, features = ["full", "normalization"] }

[dev-dependencies]
# SHA-256 of the vendored WPT data files.
purecrypto = { version = "0.10", default-features = false, features = ["hash"] }

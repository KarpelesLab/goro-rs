name: PHP Test Suite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Pushes land in bursts; only the newest run of a branch is worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: goro-binary
          path: target/release/goro
          retention-days: 3

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: goro-binary
          path: bin

      - name: Clone PHP test suite
        run: git clone --depth 1 --branch php-8.5.4 https://github.com/php/php-src.git /tmp/php-src

      - name: Run PHPT tests (shard ${{ matrix.shard }}/8)
        env:
          GORO_PHPT_SHARD: ${{ matrix.shard }}/8
        run: |
          chmod +x bin/goro
          # The runner exits non-zero when any test fails; the summary job
          # reports the counts instead.
          ./bin/goro --test /tmp/php-src/ > /tmp/test_results.txt 2>&1 || true
          tail -6 /tmp/test_results.txt

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: /tmp/test_results.txt
          retention-days: 30

  pecl:
    # The test suites of the PECL extensions goro implements (uuid), from
    # tests/pecl.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: goro-binary
          path: bin

      - name: Run PECL extension tests
        run: |
          chmod +x bin/goro
          ./bin/goro --test tests/pecl/

  summary:
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: results

      - name: Summarize
        run: |
          total() { cat results/*/test_results.txt | grep "^$1:" | awk '{s+=$2} END {print s+0}'; }
          PASS=$(total Pass); FAIL=$(total Fail); SKIP=$(total Skip); ERROR=$(total Error); XFAIL=$(total XFail); XPASS=$(total XPass); TOTAL=$(total Total)
          SHARDS=$(ls results | wc -l)
          {
            echo "## Test Results: ${PASS}/${TOTAL} passing (${SHARDS}/8 shards reported)"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Pass | $PASS |"
            echo "| Fail | $FAIL |"
            echo "| Skip | $SKIP |"
            echo "| Error | $ERROR |"
            echo "| XFail | $XFAIL |"
            echo "| XPass | $XPASS |"
            echo "| Total | $TOTAL |"
          } | tee -a $GITHUB_STEP_SUMMARY
          cat results/*/test_results.txt | grep -A 2 "^FAIL:" > test_failures.txt || true

      - name: Upload failure report
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: test_failures.txt
          retention-days: 30
